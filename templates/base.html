<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Wireless-Signal Coverage Mapper{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
  <header class="site-header">
    <div class="container nav-inner">
      <a class="brand" href="/">
        <span class="brand-mark">dB</span>
        <span>SignalMap</span>
      </a>
      <nav class="nav-links" aria-label="Primary navigation">
        <a href="/data" class="{{ 'active' if active_page == 'data' else '' }}">Data</a>
        <a href="/map" class="{{ 'active' if active_page == 'map' else '' }}">Coverage Map</a>
        <a href="/heatmap" class="{{ 'active' if active_page == 'heatmap' else '' }}">Heatmap</a>
        <a href="/model" class="{{ 'active' if active_page == 'model' else '' }}">Path-Loss Model</a>
        <a href="/stats" class="{{ 'active' if active_page == 'stats' else '' }}">Statistics</a>
        <a href="/analysis" class="{{ 'active' if active_page == 'analysis' else '' }}">Analysis</a>
        <a href="/about" class="{{ 'active' if active_page == 'about' else '' }}">About</a>
      </nav>
      <span id="nav-dataset-pill" class="dataset-pill">Loading...</span>
    </div>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <span>Wireless-Signal Coverage Mapper · Individual Engineering Project</span>
      <span>Built-in dataset is synthetically generated for reproducible RF analysis.</span>
    </div>
  </footer>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
